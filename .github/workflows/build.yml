name: Build for Appetize

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.1
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild -project HomePharmacy.xcodeproj \
                     -scheme HomePharmacy \
                     -sdk iphonesimulator \
                     -configuration Debug \
                     -derivedDataPath build_output \
                     clean build

      - name: Compress App Bundle
        run: |
          # Находим путь к скомпилированному приложению
          APP_PATH=$(find build_output -name "HomePharmacy.app" -type d | head -n 1)
          echo "App found at: $APP_PATH"
          
          # Заходим прямо в родительскую папку приложения
          cd "$(dirname "$APP_PATH")"
          
          # Архивируем только сам файл HomePharmacy.app (прямо в корень архива)
          zip -r ../../../HomePharmacy.app.zip HomePharmacy.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appetize-sim-build
          path: HomePharmacy.app.zip
