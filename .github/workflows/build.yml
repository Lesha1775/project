name: Build for Appetize

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild -project HomePharmacy.xcodeproj \
                     -scheme HomePharmacy \
                     -sdk iphonesimulator \
                     -configuration Debug \
                     -derivedDataPath build_output \
                     GENERATE_INFOPLIST_FILE=YES \
                     clean build

      - name: Compress App Bundle
        run: |
          # Находим .app файл в недрах Xcode 15
          APP_PATH=$(find build_output -name "HomePharmacy.app" -type d | head -n 1)
          echo "App found at: $APP_PATH"
          
          # Утилита ditto — это эталонный способ Apple для создания чистых .zip без мусора
          ditto -c -k --sequesterRsrc "$APP_PATH" ./HomePharmacy.app.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appetize-sim-build
          path: HomePharmacy.app.zip
